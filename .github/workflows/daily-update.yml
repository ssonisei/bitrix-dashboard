name: Daily Bitrix24 dashboard update

on:
  schedule:
    # 21:00 UTC = 02:00 (ночь) по времени Алматы (UTC+5)
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily_update.py
        env:
          PYTHONUNBUFFERED: "1"
          TASKS_WEBHOOK: ${{ secrets.TASKS_WEBHOOK }}
          USERS_WEBHOOK: ${{ secrets.USERS_WEBHOOK }}
          DEPARTMENTS_WEBHOOK: ${{ secrets.DEPARTMENTS_WEBHOOK }}
          EXCLUDED_USER_IDS: ${{ secrets.EXCLUDED_USER_IDS }}
        run: python daily_update.py

      - name: Commit updated data.json and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/tasks_archive.json
          git diff --staged --quiet || git commit -m "Автообновление данных дашборда"
          git push
