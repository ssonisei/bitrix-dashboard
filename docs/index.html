<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд задач Bitrix24</title>
<style>
  :root {
    --bg: #f5f5f3;
    --card: #ffffff;
    --border: #e2e1dc;
    --text: #1a1a18;
    --text-muted: #6b6a64;
    --accent: #2a78d6;
    --danger: #d03b3b;
    --success: #1baf7a;
    --warning: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131311;
      --card: #1d1d1a;
      --border: #33322e;
      --text: #f0efec;
      --text-muted: #a3a29b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .filters .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  .filters label { font-size: 12px; color: var(--text-muted); }
  .filters select, .filters input[type=date] {
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .filters button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .filters button:hover { border-color: var(--accent); }
  .filter-summary { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .kpi .label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 600; }
  .kpi .value.danger { color: var(--danger); }
  .kpi .value.success { color: var(--success); }
  section { margin-bottom: 32px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .chart-wrap { position: relative; height: 300px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .pill.ok { background: rgba(27,175,122,0.15); color: var(--success); }
  .pill.bad { background: rgba(208,59,59,0.15); color: var(--danger); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .updated { color: var(--text-muted); font-size: 12px; margin-top: 24px; text-align: center; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-row td { text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Дашборд задач сотрудников</h1>
  <p class="subtitle" id="period-label">Загрузка данных...</p>

  <div id="content" style="display:none;">

    <div class="filters">
      <div class="field">
        <label for="f-dept">Отдел</label>
        <select id="f-dept"><option value="">Все отделы</option></select>
      </div>
      <div class="field">
        <label for="f-emp">Сотрудник</label>
        <select id="f-emp"><option value="">Все сотрудники</option></select>
      </div>
      <div class="field">
        <label for="f-from">Крайний срок с</label>
        <input type="date" id="f-from">
      </div>
      <div class="field">
        <label for="f-to">Крайний срок по</label>
        <input type="date" id="f-to">
      </div>
      <button id="f-reset">Сбросить фильтры</button>
    </div>
    <p class="filter-summary" id="filter-summary"></p>

    <div class="kpi-row" id="kpi-row"></div>

    <section>
      <h2>Создано / завершено по дням</h2>
      <div class="card">
        <div class="chart-wrap"><canvas id="trendChart" role="img" aria-label="Динамика созданных и завершённых задач по дням"></canvas></div>
      </div>
    </section>

    <section>
      <h2>Отделы по нагрузке</h2>
      <div class="card">
        <div class="chart-wrap"><canvas id="deptChart" role="img" aria-label="Количество задач по отделам"></canvas></div>
      </div>
    </section>

    <section>
      <h2>Просроченные сейчас</h2>
      <div class="card">
        <table id="overdue-table">
          <thead><tr><th>Задача</th><th>Сотрудник</th><th>Отдел</th><th>Дней просрочки</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Сотрудники</h2>
      <div class="card" style="overflow-x:auto;">
        <table id="emp-table">
          <thead><tr>
            <th data-sort="dept">Отдел</th>
            <th data-sort="fio">Сотрудник</th>
            <th data-sort="total">Всего</th>
            <th data-sort="done">Завершено</th>
            <th data-sort="pct_done">% завершено</th>
            <th data-sort="overdue_now">Просрочено</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="loading" class="loading">Загрузка данных…</div>
  <p class="updated" id="updated-label"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let RAW = null;
let trendChart = null, deptChart = null;
let empSort = { key: 'total', dir: -1 };

fetch('data.json?t=' + Date.now())
  .then(r => {
    if (!r.ok) throw new Error('data.json не найден');
    return r.json();
  })
  .then(data => {
    RAW = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('updated-label').textContent =
      'Обновлено: ' + new Date(data.generated_at).toLocaleString('ru-RU');
    initFilters(data);
    applyFiltersAndRender();
  })
  .catch(err => {
    document.getElementById('loading').innerHTML =
      '<div class="error">Не удалось загрузить данные: ' + err.message +
      '<br>Убедитесь, что daily_update.py уже отработал хотя бы раз.</div>';
  });

function initFilters(data) {
  const depts = [...new Set(data.tasks.map(t => t.dept).filter(Boolean))].sort();
  const deptSelect = document.getElementById('f-dept');
  depts.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    deptSelect.appendChild(opt);
  });

  document.getElementById('f-from').value = data.period_start;
  document.getElementById('f-to').value = data.period_end;

  refreshEmployeeOptions();

  deptSelect.addEventListener('change', () => { refreshEmployeeOptions(); applyFiltersAndRender(); });
  document.getElementById('f-emp').addEventListener('change', applyFiltersAndRender);
  document.getElementById('f-from').addEventListener('change', applyFiltersAndRender);
  document.getElementById('f-to').addEventListener('change', applyFiltersAndRender);
  document.getElementById('f-reset').addEventListener('click', () => {
    deptSelect.value = '';
    refreshEmployeeOptions();
    document.getElementById('f-emp').value = '';
    document.getElementById('f-from').value = RAW.period_start;
    document.getElementById('f-to').value = RAW.period_end;
    applyFiltersAndRender();
  });

  document.querySelectorAll('#emp-table th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (empSort.key === key) empSort.dir *= -1; else { empSort.key = key; empSort.dir = -1; }
      applyFiltersAndRender();
    });
  });
}

function refreshEmployeeOptions() {
  const dept = document.getElementById('f-dept').value;
  const empSelect = document.getElementById('f-emp');
  const current = empSelect.value;
  empSelect.innerHTML = '<option value="">Все сотрудники</option>';
  const emps = [...new Set(
    RAW.tasks.filter(t => !dept || t.dept === dept).map(t => t.employee).filter(Boolean)
  )].sort();
  emps.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e; opt.textContent = e;
    empSelect.appendChild(opt);
  });
  if (emps.includes(current)) empSelect.value = current;
}

function applyFiltersAndRender() {
  const dept = document.getElementById('f-dept').value;
  const emp = document.getElementById('f-emp').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;

  const filtered = RAW.tasks.filter(t => {
    if (dept && t.dept !== dept) return false;
    if (emp && t.employee !== emp) return false;
    if (from && t.deadline && t.deadline < from) return false;
    if (to && t.deadline && t.deadline > to) return false;
    return true;
  });

  document.getElementById('period-label').textContent =
    'Период данных: ' + RAW.period_start + ' — ' + RAW.period_end + ' (обновляется ежедневно)';
  document.getElementById('filter-summary').textContent =
    'Показано задач: ' + filtered.length + ' из ' + RAW.tasks.length;

  renderKpis(filtered);
  renderTrend(filtered, from || RAW.period_start, to || RAW.period_end);
  renderDeptChart(filtered);
  renderOverdue(filtered);
  renderEmployees(filtered);
}

function renderKpis(tasks) {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const overdueNow = tasks.filter(t => t.overdue_now).length;
  const noDeadline = tasks.filter(t => t.no_deadline).length;
  const depts = new Set(tasks.map(t => t.dept).filter(Boolean)).size;
  const emps = new Set(tasks.map(t => t.employee).filter(Boolean)).size;
  const pctDone = total ? Math.round(100 * done / total) : 0;

  const kpis = [
    { label: 'Всего задач', value: total, cls: '' },
    { label: 'Завершено', value: done + ' (' + pctDone + '%)', cls: 'success' },
    { label: 'Просрочено сейчас', value: overdueNow, cls: overdueNow > 0 ? 'danger' : '' },
    { label: 'Без дедлайна', value: noDeadline, cls: '' },
    { label: 'Сотрудников', value: emps, cls: '' },
    { label: 'Отделов', value: depts, cls: '' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k =>
    '<div class="kpi"><div class="label">' + k.label + '</div><div class="value ' + k.cls + '">' + k.value + '</div></div>'
  ).join('');
}

function renderTrend(tasks, from, to) {
  const counts = {};
  const start = new Date(from), end = new Date(to);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    counts[d.toISOString().slice(0, 10)] = { created: 0, completed: 0 };
  }
  tasks.forEach(t => {
    if (t.created && counts[t.created]) counts[t.created].created++;
    if (t.done && t.closed && counts[t.closed]) counts[t.closed].completed++;
  });
  const labels = Object.keys(counts).sort();

  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: labels.map(d => d.slice(5)),
      datasets: [
        { label: 'Создано', data: labels.map(d => counts[d].created), borderColor: '#2a78d6', backgroundColor: 'rgba(42,120,214,0.1)', fill: true, tension: 0.2 },
        { label: 'Завершено', data: labels.map(d => counts[d].completed), borderColor: '#1baf7a', backgroundColor: 'rgba(27,175,122,0.1)', fill: true, tension: 0.2 },
      ],
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } },
  });
}

function renderDeptChart(tasks) {
  const byDept = {};
  tasks.forEach(t => {
    if (!t.dept) return;
    byDept[t.dept] = (byDept[t.dept] || 0) + 1;
  });
  const top = Object.entries(byDept).sort((a, b) => b[1] - a[1]).slice(0, 12);

  if (deptChart) deptChart.destroy();
  deptChart = new Chart(document.getElementById('deptChart'), {
    type: 'bar',
    data: {
      labels: top.map(d => d[0]),
      datasets: [{ label: 'Задач', data: top.map(d => d[1]), backgroundColor: '#2a78d6', borderRadius: 4 }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true } },
    },
  });
}

function renderOverdue(tasks) {
  const overdue = tasks.filter(t => t.overdue_now && t.overdue_days > 0)
    .sort((a, b) => b.overdue_days - a.overdue_days)
    .slice(0, 20);
  const body = document.querySelector('#overdue-table tbody');
  body.innerHTML = overdue.length ? overdue.map(t =>
    '<tr><td><a href="' + t.url + '" target="_blank">' + escapeHtml(t.title) + '</a></td>' +
    '<td>' + escapeHtml(t.employee) + '</td>' +
    '<td>' + escapeHtml(t.dept) + '</td>' +
    '<td><span class="pill bad">' + t.overdue_days + ' дн.</span></td></tr>'
  ).join('') : '<tr class="empty-row"><td colspan="4">Просроченных задач нет</td></tr>';
}

function renderEmployees(tasks) {
  const byEmp = {};
  tasks.forEach(t => {
    if (!t.employee) return;
    if (!byEmp[t.employee]) byEmp[t.employee] = { dept: t.dept, fio: t.employee, total: 0, done: 0, overdue_now: 0 };
    byEmp[t.employee].total++;
    if (t.done) byEmp[t.employee].done++;
    if (t.overdue_now) byEmp[t.employee].overdue_now++;
  });
  let rows = Object.values(byEmp).map(e => ({
    ...e,
    pct_done: e.total ? Math.round(100 * e.done / e.total) : 0,
  }));

  rows.sort((a, b) => {
    const k = empSort.key;
    if (a[k] < b[k]) return -1 * empSort.dir;
    if (a[k] > b[k]) return 1 * empSort.dir;
    return 0;
  });

  const body = document.querySelector('#emp-table tbody');
  body.innerHTML = rows.length ? rows.map(e =>
    '<tr><td>' + escapeHtml(e.dept) + '</td><td>' + escapeHtml(e.fio) + '</td>' +
    '<td>' + e.total + '</td><td>' + e.done + '</td>' +
    '<td><span class="pill ' + (e.pct_done >= 80 ? 'ok' : 'bad') + '">' + e.pct_done + '%</span></td>' +
    '<td>' + (e.overdue_now > 0 ? '<span class="pill bad">' + e.overdue_now + '</span>' : '0') + '</td></tr>'
  ).join('') : '<tr class="empty-row"><td colspan="6">Нет данных за выбранный период</td></tr>';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
